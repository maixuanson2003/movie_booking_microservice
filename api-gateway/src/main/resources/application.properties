spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}
spring.main.web-application-type=reactive

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=5s

eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Explicit API routes; backend instances are resolved through Eureka.
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth,/api/auth/**,/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users,/api/users/**

spring.cloud.gateway.server.webflux.routes[2].id=movie-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://movie-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/movies,/api/movies/**,/movies/**

spring.cloud.gateway.server.webflux.routes[3].id=cinema-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://cinema-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/cinemas,/api/cinemas/**,/api/theaters,/api/theaters/**,/api/rooms,/api/rooms/**,/api/showtimes,/api/showtimes/**,/api/seats,/api/seats/**

spring.cloud.gateway.server.webflux.routes[4].id=booking-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://booking-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/bookings,/api/bookings/**,/api/combos,/api/combos/**,/bookings/**

spring.cloud.gateway.server.webflux.routes[5].id=payment-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/payments,/api/payments/**,/api/invoices,/api/invoices/**,/api/payment-methods,/api/payment-methods/**
